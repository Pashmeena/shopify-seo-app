# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "77835ef4889537f8adef37ad234f714d"
application_url = "https://example.com"
embedded = true
name = "Wild ventures test"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_products: read/seed the catalog. write_content: publish PLPs as blog articles.
# read_publications + write_publications: publish seeded products to the Online Store.
# write_online_store_navigation: create the 301 redirects that make a canonical
#   consolidation real. A blog article's <head> canonical belongs to the theme,
#   so a redirect is how a near-duplicate is folded onto its canonical page —
#   see app/services/publishing/consolidation.server.ts.
scopes = "write_products,write_content,read_publications,write_publications,write_online_store_navigation"
optional_scopes = [ ]
use_legacy_install_flow = false

[build]
# Point the app's URL at the dev tunnel automatically on every `app dev`.
automatically_update_urls_on_dev = true
include_config_on_deploy = true

# Serves llms.txt and sitemap-ai.xml from the store's own domain:
#   https://<store>/apps/seo/llms.txt
#   https://<store>/apps/seo/sitemap-ai.xml
# Shopify signs proxied requests, so the handlers authenticate the shop rather
# than accepting it as a query parameter. An app cannot own the true store
# root (/llms.txt) — see the README for what a merchant does about that.
#
# `url` is a placeholder, as `application_url` above is. Both are rewritten to
# the dev tunnel by automatically_update_urls_on_dev. If the proxy URL is ever
# left pointing here, the app-domain routes in app/routes/llms[.]txt.tsx still
# work and Settings links to them.
[app_proxy]
url = "https://example.com/proxy"
subpath = "seo"
prefix = "apps"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ ]
