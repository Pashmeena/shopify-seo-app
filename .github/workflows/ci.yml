on: [push, pull_request]

name: CI

jobs:
  CI:
    # package.json engines allows ">=20.19 <22 || >=22.12"; both ends are built.
    name: CI_Node_${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [20.19.0, 22.12.0]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      # npm, not yarn: the repo is locked with package-lock.json.
      - name: Install
        run: npm ci
      # Modules under test import @prisma/client, so the client has to be
      # generated before typecheck and tests run.
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
